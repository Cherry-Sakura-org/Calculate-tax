geocoding:
  provider: ${GEOCODING_PROVIDER:mapbox}  # nominatim, locationiq, or mapbox
  api-rate-limit:
    requests-per-second: ${GEOCODING_RATE_LIMIT:10}
  locationiq:
    api-key: ${LOCATIONIQ_API_KEY:}
  mapbox:
    access-token: ${MAPBOX_ACCESS_TOKEN:}

spring:
  application:
    name: backend

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  threads:
    virtual:
      enabled: true

  mvc:
    apiversion:
      use:
        header: API-Version
      default: v1
      required: false
      detect-supported: true
      supported:
        - v1

  config:
    import: optional:file:backend/.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  main:
    banner-mode: off

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
      key-prefix: "iwk:"
      use-key-prefix: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy}
            scope: user:email,read:user
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope: openid,profile,email

jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-please-32chars}
  ttl: ${JWT_TTL:10800000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    max-age: ${JWT_COOKIE_MAX_AGE:10800}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

app:
  import:
    max-file-size-bytes: ${IMPORT_MAX_FILE_SIZE_BYTES:524288000}