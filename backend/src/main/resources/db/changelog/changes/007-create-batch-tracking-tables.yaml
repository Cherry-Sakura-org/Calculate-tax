databaseChangeLog:
  - changeSet:
      id: 007-create-batch-tracking-tables
      author: system
      changes:
        - createTable:
            tableName: batch_job_executions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP
              - column:
                  name: total_records
                  type: INTEGER
              - column:
                  name: processed_records
                  type: INTEGER
              - column:
                  name: successful_records
                  type: INTEGER
              - column:
                  name: failed_records
                  type: INTEGER
              - column:
                  name: skipped_records
                  type: INTEGER
              - column:
                  name: error_message
                  type: VARCHAR(2000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: batch_import_errors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_execution_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_batch_errors_job
                    references: batch_job_executions(id)
              - column:
                  name: row_number
                  type: INTEGER
              - column:
                  name: latitude
                  type: DECIMAL(10,8)
              - column:
                  name: longitude
                  type: DECIMAL(11,8)
              - column:
                  name: error_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(1000)
              - column:
                  name: record_data
                  type: VARCHAR(2000)

        - createIndex:
            indexName: idx_batch_job_status
            tableName: batch_job_executions
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            indexName: idx_batch_job_created
            tableName: batch_job_executions
            columns:
              - column:
                  name: created_at
                  descending: true
