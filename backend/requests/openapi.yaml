openapi: 3.1.0
info:
  title: Instant Wellness Kits API
  description: |
    REST API for order management with automatic tax calculation and geocoding.

    **Key Features:**
    - 📍 Geocoding with Mapbox (New York State only)
    - 💰 Automatic tax calculation (state, county, city, MCTD)
    - 📊 Async CSV batch import with real-time progress
    - 📡 SSE (Server-Sent Events) for live updates
    - 📈 Detailed error reporting and job history

    **Tech Stack:**
    - Spring Boot 4.0.3
    - Spring Batch 6.0
    - PostgreSQL + Redis
    - Mapbox Geocoding API
  contact:
    name: Acheron Team
    email: support@acheron.com
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.acheron.com
  description: Production server
tags:
- name: Native Import
  description: High-performance native CSV import with GeoJSON tax calculation (~11k
    records/sec)
- name: Tax Localities
  description: "Manage NY State tax locality data — rates, counties, special districts"
- name: Batch Import
  description: Async CSV import with real-time progress tracking via SSE
- name: Map
  description: "Map data API — GeoJSON orders with filters, boundary layers, stats,\
    \ CSV preview"
- name: Orders
  description: Order management API with native GeoJSON tax calculation
paths:
  /tax-localities:
    get:
      tags:
      - Tax Localities
      summary: Get all tax localities
      description: "Returns all NY State tax localities with rates, reporting codes,\
        \ and district flags. Cached for 24h."
      operationId: getAllTaxLocalities
      responses:
        "200":
          description: List of tax localities
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxLocality"
    post:
      tags:
      - Tax Localities
      summary: Create a single tax locality
      operationId: createTaxLocality
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxLocality"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxLocality"
  /tax-localities/reload:
    post:
      tags:
      - Tax Localities
      summary: Reload tax localities from built-in JSON
      description: Deletes ALL existing tax localities and reloads from the bundled
        ny-tax-localities.json file. Clears all caches.
      operationId: reloadFromJson
      responses:
        "200":
          description: Reloaded successfully
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
        "500":
          description: Failed to reload
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /tax-localities/import:
    post:
      tags:
      - Tax Localities
      summary: Import tax localities from custom JSON body
      description: Deletes ALL existing tax localities and replaces them with the
        provided JSON array. Clears all caches.
      operationId: importFromJson
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Imported successfully
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
        "400":
          description: Invalid JSON
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /orders:
    get:
      tags:
      - Orders
      summary: Get all orders
      description: Retrieves a paginated list of orders sorted by total amount
      operationId: getAllOrders
      parameters:
      - name: pageable
        in: query
        description: "Pagination parameters (page, size, sort)"
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
    post:
      tags:
      - Orders
      summary: Create new order
      description: Creates a new order with automatic tax calculation based on coordinates
        using native GeoJSON point-in-polygon lookup. No external API calls.
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "201":
          description: Order created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid request or location outside NY State
  /api/v1/orders/import:
    post:
      tags:
      - Batch Import
      summary: Start async CSV import
      description: Queues a CSV file for asynchronous batch processing. Returns immediately
        with job ID for tracking progress via SSE.
      operationId: startImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file with columns: latitude, longitude, subtotal,\
                    \ timestamp"
              required:
              - file
      responses:
        "200":
          description: Import job queued successfully
          content:
            '*/*':
              schema:
                type: string
                example:
                  message: Import job queued successfully
                  jobId: 1
                  filename: orders.csv
                  status: QUEUED
        "400":
          description: Invalid file or upload failed
  /api/v1/native/import:
    post:
      tags:
      - Native Import
      summary: Import orders from CSV (native)
      description: "High-performance CSV import using virtual threads and native GeoJSON\
        \ point-in-polygon tax calculation. No external API calls. Processes ~11k\
        \ records/sec. CSV columns: id, longitude, latitude, timestamp, subtotal"
      operationId: importCsv
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file with columns: id, longitude, latitude, timestamp,\
                    \ subtotal"
              required:
              - file
      responses:
        "200":
          description: Import completed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid CSV file
  /api/v1/map/csv-preview:
    post:
      tags:
      - Map
      summary: Preview CSV points on map (no save)
      description: Parses CSV → GeoJSON points for map preview. Does NOT persist.
        Includes point count and subtotal sum.
      operationId: previewCsvOnMap
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file: id, longitude, latitude, timestamp, subtotal"
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            application/geo+json:
              schema:
                type: object
                additionalProperties: {}
  /api/v1/map/cache/clear:
    post:
      tags:
      - Map
      summary: Clear GeoJSON tax calc cache
      operationId: clearCache
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /tax-localities/{locality}:
    get:
      tags:
      - Tax Localities
      summary: Find tax locality by name
      description: "Lookup a specific locality by name (case-insensitive, normalizes\
        \ county suffixes and NYC borough aliases)."
      operationId: getTaxLocality
      parameters:
      - name: locality
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Tax locality found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxLocality"
        "404":
          description: Locality not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxLocality"
    delete:
      tags:
      - Tax Localities
      summary: Delete a tax locality by name
      operationId: deleteTaxLocality
      parameters:
      - name: locality
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/orders/import/{jobId}:
    get:
      tags:
      - Batch Import
      summary: Get job details
      description: "Retrieves detailed information about a specific batch import job\
        \ including status, metrics, and timing"
      operationId: getJobDetails
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Job details retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BatchJobResponse"
        "404":
          description: Job not found
  /api/v1/orders/import/{jobId}/report:
    get:
      tags:
      - Batch Import
      summary: Get complete job report
      description: Retrieves comprehensive job report including job details and all
        error records. Suitable for export as JSON.
      operationId: getJobReport
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Report generated successfully
          content:
            '*/*':
              schema:
                type: string
                example: "{\"job\": {...}, \"errors\": [...]}"
        "404":
          description: Job not found
  /api/v1/orders/import/{jobId}/errors:
    get:
      tags:
      - Batch Import
      summary: Get job errors
      description: "Retrieves all error details for failed records in a specific job.\
        \ Includes coordinates, error type, and messages."
      operationId: getJobErrors
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Errors retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
        "404":
          description: Job not found
  /api/v1/orders/import/status/{jobId}:
    get:
      tags:
      - Batch Import
      summary: Stream job status via SSE
      description: Establishes Server-Sent Events connection for real-time job progress
        updates. Auto-closes when job completes or fails. Updates every 1 second.
      operationId: streamJobStatus
      parameters:
      - name: jobId
        in: path
        description: Job ID returned from start import
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: SSE stream established
          content:
            text/event-stream: {}
        "404":
          description: Job not found
  /api/v1/orders/import/history:
    get:
      tags:
      - Batch Import
      summary: Get job history
      description: Retrieves paginated list of all batch import jobs ordered by creation
        date (newest first)
      operationId: getJobHistory
      parameters:
      - name: page
        in: query
        description: Page number (0-indexed)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Page size (max 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Job history retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModel"
  /api/v1/map/orders:
    get:
      tags:
      - Map
      summary: Get orders as GeoJSON with filters + aggregate summary
      description: |-
        Returns orders as a GeoJSON FeatureCollection with rich filtering:
        - **Bounding box**: minLat/maxLat/minLon/maxLon for viewport loading
        - **Subtotal range**: minSubtotal/maxSubtotal
        - **Tax rate range**: minTaxRate/maxTaxRate (composite rate, e.g. 0.08)
        - **Date range**: from/to (ISO datetime)
        - **Limit**: max features returned (default 10000)

        Response includes `summary` with aggregate totals for the filtered set.
      operationId: getOrdersGeoJson
      parameters:
      - name: minLat
        in: query
        description: Min latitude (bounding box)
        required: false
        schema:
          type: number
      - name: maxLat
        in: query
        description: Max latitude (bounding box)
        required: false
        schema:
          type: number
      - name: minLon
        in: query
        description: Min longitude (bounding box)
        required: false
        schema:
          type: number
      - name: maxLon
        in: query
        description: Max longitude (bounding box)
        required: false
        schema:
          type: number
      - name: minSubtotal
        in: query
        description: Min subtotal filter
        required: false
        schema:
          type: number
      - name: maxSubtotal
        in: query
        description: Max subtotal filter
        required: false
        schema:
          type: number
      - name: minTaxRate
        in: query
        description: Min composite tax rate (e.g. 0.04)
        required: false
        schema:
          type: number
      - name: maxTaxRate
        in: query
        description: Max composite tax rate (e.g. 0.09)
        required: false
        schema:
          type: number
      - name: from
        in: query
        description: "From date (ISO, e.g. 2024-01-01T00:00:00)"
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: "To date (ISO, e.g. 2024-12-31T23:59:59)"
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Max features to return (default 10000)
        required: false
        schema:
          type: integer
          format: int32
          default: 10000
      responses:
        "200":
          description: GeoJSON FeatureCollection with summary
          content:
            application/geo+json:
              schema:
                type: object
                additionalProperties: {}
  /api/v1/map/orders/stats:
    get:
      tags:
      - Map
      summary: Get order stats summary
      description: "Aggregate stats: total orders, revenue, tax, avg value, orders-by-county\
        \ breakdown. Supports same filters as /orders."
      operationId: getOrderStats
      parameters:
      - name: minLat
        in: query
        required: false
        schema:
          type: number
      - name: maxLat
        in: query
        required: false
        schema:
          type: number
      - name: minLon
        in: query
        required: false
        schema:
          type: number
      - name: maxLon
        in: query
        required: false
        schema:
          type: number
      - name: minSubtotal
        in: query
        required: false
        schema:
          type: number
      - name: maxSubtotal
        in: query
        required: false
        schema:
          type: number
      - name: minTaxRate
        in: query
        required: false
        schema:
          type: number
      - name: maxTaxRate
        in: query
        required: false
        schema:
          type: number
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/map/cache/stats:
    get:
      tags:
      - Map
      summary: Get GeoJSON tax calc cache stats
      operationId: getCacheStats
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/map/boundaries/counties:
    get:
      tags:
      - Map
      summary: Get NY county boundaries GeoJSON
      operationId: getCountyBoundaries
      responses:
        "200":
          description: OK
          content:
            application/geo+json:
              schema:
                type: string
                format: byte
  /api/v1/map/boundaries/boroughs:
    get:
      tags:
      - Map
      summary: Get NYC borough boundaries GeoJSON
      operationId: getBoroughBoundaries
      responses:
        "200":
          description: OK
          content:
            application/geo+json:
              schema:
                type: string
                format: byte
components:
  schemas:
    TaxLocality:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        locality:
          type: string
        taxRatePercent:
          type: number
        reportingCode:
          type: string
        seeReference:
          type: string
        isSpecialDistrict:
          type: boolean
        isMctdDistrict:
          type: boolean
        parentCounty:
          type: string
        notes:
          type: string
    OrderRequest:
      type: object
      description: "Order details with latitude, longitude, and subtotal"
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
        subtotal:
          type: number
      required:
      - latitude
      - longitude
      - subtotal
    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        subtotal:
          type: number
        composite_tax_rate:
          type: number
        tax_amount:
          type: number
        total_amount:
          type: number
        timestamp:
          type: string
          format: date-time
        taxBreakdown:
          $ref: "#/components/schemas/TaxBreakdown"
        jurisdictions:
          type: array
          items:
            type: string
    TaxBreakdown:
      type: object
      properties:
        state_rate:
          type: number
        county_rate:
          type: number
        city_rate:
          type: number
        special_rates:
          type: number
    ImportError:
      type: object
      properties:
        lineNumber:
          type: integer
          format: int32
        errorMessage:
          type: string
        recordData:
          type: string
    ImportResult:
      type: object
      properties:
        totalRecords:
          type: integer
          format: int32
        successfulRecords:
          type: integer
          format: int32
        failedRecords:
          type: integer
          format: int32
        durationMs:
          type: integer
          format: int64
        recordsPerSecond:
          type: number
          format: double
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    BatchJobResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        jobName:
          type: string
        filename:
          type: string
        status:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalRecords:
          type: integer
          format: int32
        processedRecords:
          type: integer
          format: int32
        successfulRecords:
          type: integer
          format: int32
        failedRecords:
          type: integer
          format: int32
        skippedRecords:
          type: integer
          format: int32
        errorMessage:
          type: string
        durationMs:
          type: integer
          format: int64
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModel:
      type: object
      properties:
        content:
          type: array
          items: {}
        page:
          $ref: "#/components/schemas/PageMetadata"
