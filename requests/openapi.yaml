openapi: 3.1.0
info:
  title: Instant Wellness Kits API
  description: |
    REST API for order management with automatic tax calculation and geocoding.

    **Key Features:**
    - 📍 Geocoding with Mapbox (New York State only)
    - 💰 Automatic tax calculation (state, county, city, MCTD)
    - 📊 Async CSV batch import with real-time progress
    - 📡 SSE (Server-Sent Events) for live updates
    - 📈 Detailed error reporting and job history

    **Tech Stack:**
    - Spring Boot 4.0.3
    - Spring Batch 6.0
    - PostgreSQL + Redis
    - Mapbox Geocoding API
  contact:
    name: Acheron Team
    email: support@acheron.com
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.acheron.com
  description: Production server
tags:
- name: Orders
  description: Order management API with tax calculation and geocoding
- name: Batch Import
  description: Async CSV import with real-time progress tracking via SSE
paths:
  /tax-localities:
    get:
      tags:
      - tax-locality-api
      operationId: getAllTaxLocalities
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxLocality"
    post:
      tags:
      - tax-locality-api
      operationId: createTaxLocality
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxLocality"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxLocality"
  /tax-localities/reload:
    post:
      tags:
      - tax-locality-api
      operationId: reloadFromJson
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /tax-localities/import:
    post:
      tags:
      - tax-locality-api
      operationId: importFromJson
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /orders:
    get:
      tags:
      - Orders
      summary: Get all orders
      description: Retrieves a paginated list of orders sorted by total amount
      operationId: getAllOrders
      parameters:
      - name: pageable
        in: query
        description: "Pagination parameters (page, size, sort)"
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
    post:
      tags:
      - Orders
      summary: Create new order
      description: "Creates a new order with automatic tax calculation based on coordinates.\
        \ Validates that the location is within New York State and calculates appropriate\
        \ state, county, and city taxes."
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "201":
          description: Order created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid request or location outside NY State
        "500":
          description: Geocoding or tax calculation failed
  /orders/import:
    post:
      tags:
      - Orders
      summary: Import orders from CSV (Deprecated)
      description: Synchronous CSV import. **Deprecated:** Use /api/v1/orders/import
        for async processing with real-time progress tracking.
      operationId: importOrdersFromCsv
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file with columns: latitude, longitude, subtotal,\
                    \ timestamp"
              required:
              - file
      responses:
        "200":
          description: Import completed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BatchJobExecutionResult"
        "400":
          description: Invalid CSV file
      deprecated: true
  /api/v1/orders/import:
    post:
      tags:
      - Batch Import
      summary: Start async CSV import
      description: Queues a CSV file for asynchronous batch processing. Returns immediately
        with job ID for tracking progress via SSE.
      operationId: startImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file with columns: latitude, longitude, subtotal,\
                    \ timestamp"
              required:
              - file
      responses:
        "200":
          description: Import job queued successfully
          content:
            '*/*':
              schema:
                type: string
                example:
                  message: Import job queued successfully
                  jobId: 1
                  filename: orders.csv
                  status: QUEUED
        "400":
          description: Invalid file or upload failed
  /tax-localities/{locality}:
    get:
      tags:
      - tax-locality-api
      operationId: getTaxLocality
      parameters:
      - name: locality
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxLocality"
    delete:
      tags:
      - tax-locality-api
      operationId: deleteTaxLocality
      parameters:
      - name: locality
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/orders/import/{jobId}:
    get:
      tags:
      - Batch Import
      summary: Get job details
      description: "Retrieves detailed information about a specific batch import job\
        \ including status, metrics, and timing"
      operationId: getJobDetails
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Job details retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BatchJobResponse"
        "404":
          description: Job not found
  /api/v1/orders/import/{jobId}/report:
    get:
      tags:
      - Batch Import
      summary: Get complete job report
      description: Retrieves comprehensive job report including job details and all
        error records. Suitable for export as JSON.
      operationId: getJobReport
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Report generated successfully
          content:
            '*/*':
              schema:
                type: string
                example: "{\"job\": {...}, \"errors\": [...]}"
        "404":
          description: Job not found
  /api/v1/orders/import/{jobId}/errors:
    get:
      tags:
      - Batch Import
      summary: Get job errors
      description: "Retrieves all error details for failed records in a specific job.\
        \ Includes coordinates, error type, and messages."
      operationId: getJobErrors
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Errors retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
        "404":
          description: Job not found
  /api/v1/orders/import/status/{jobId}:
    get:
      tags:
      - Batch Import
      summary: Stream job status via SSE
      description: Establishes Server-Sent Events connection for real-time job progress
        updates. Auto-closes when job completes or fails. Updates every 1 second.
      operationId: streamJobStatus
      parameters:
      - name: jobId
        in: path
        description: Job ID returned from start import
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: SSE stream established
          content:
            text/event-stream: {}
        "404":
          description: Job not found
  /api/v1/orders/import/history:
    get:
      tags:
      - Batch Import
      summary: Get job history
      description: Retrieves paginated list of all batch import jobs ordered by creation
        date (newest first)
      operationId: getJobHistory
      parameters:
      - name: page
        in: query
        description: Page number (0-indexed)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Page size (max 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Job history retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModel"
components:
  schemas:
    TaxLocality:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        locality:
          type: string
        taxRatePercent:
          type: number
        reportingCode:
          type: string
        seeReference:
          type: string
        isSpecialDistrict:
          type: boolean
        isMctdDistrict:
          type: boolean
        parentCounty:
          type: string
        notes:
          type: string
    OrderRequest:
      type: object
      description: "Order details with latitude, longitude, and subtotal"
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
        subtotal:
          type: number
      required:
      - latitude
      - longitude
      - subtotal
    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        subtotal:
          type: number
        composite_tax_rate:
          type: number
        tax_amount:
          type: number
        total_amount:
          type: number
        timestamp:
          type: string
          format: date-time
        taxBreakdown:
          $ref: "#/components/schemas/TaxBreakdown"
        jurisdictions:
          type: array
          items:
            type: string
    TaxBreakdown:
      type: object
      properties:
        state_rate:
          type: number
        county_rate:
          type: number
        city_rate:
          type: number
        special_rates:
          type: number
    BatchJobExecutionResult:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        status:
          type: string
        totalRecords:
          type: integer
          format: int32
        processedRecords:
          type: integer
          format: int32
        failedRecords:
          type: integer
          format: int32
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        errorMessage:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    BatchJobResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        jobName:
          type: string
        filename:
          type: string
        status:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalRecords:
          type: integer
          format: int32
        processedRecords:
          type: integer
          format: int32
        successfulRecords:
          type: integer
          format: int32
        failedRecords:
          type: integer
          format: int32
        skippedRecords:
          type: integer
          format: int32
        errorMessage:
          type: string
        durationMs:
          type: integer
          format: int64
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModel:
      type: object
      properties:
        content:
          type: array
          items: {}
        page:
          $ref: "#/components/schemas/PageMetadata"
