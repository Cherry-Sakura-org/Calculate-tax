name: Deploy to DEV_BACKEND

on:
  push:
    branches:
      - dev_backend
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend_hack:latest
          platforms: linux/amd64,linux/arm64

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST1 }}
          username: ${{ secrets.DEV_USER1 }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY1 }}
          #passphrase: ${{ secrets.DEV_SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

            cd ${{ secrets.DEV_DEPLOY_PATH1 }}
            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d