<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/react.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Instant Wellness Kits — Command Center</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            *, *::before, *::after { box-sizing: border-box; }
            html, body { margin: 0; padding: 0; }
            body {
                background: #f5f3f0;
                min-height: 100vh;
            }
            #root { min-height: 100vh; }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* Custom scrollbar */
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: #edebe8; }
            ::-webkit-scrollbar-thumb { background: #c8c4be; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #a8a49e; }
        </style>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
