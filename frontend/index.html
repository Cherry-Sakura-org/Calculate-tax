<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/react.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Instant Wellness Kits — Command Center</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            *, *::before, *::after { box-sizing: border-box; }
            html, body { margin: 0; padding: 0; }
            body {
                background: #070b14;
                min-height: 100vh;
            }
            #root { min-height: 100vh; }

            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(24px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes slideInLeft {
                from { opacity: 0; transform: translateX(-20px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes pulseGlow {
                0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); }
                50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.3); }
            }
            @keyframes shimmer {
                0% { background-position: -200% 0; }
                100% { background-position: 200% 0; }
            }
            @keyframes borderGlow {
                0%, 100% { border-color: rgba(0, 229, 255, 0.2); }
                50% { border-color: rgba(0, 229, 255, 0.5); }
            }

            /* Custom scrollbar */
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: #0d1321; }
            ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #334155; }
        </style>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
